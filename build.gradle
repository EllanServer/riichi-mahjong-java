plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'top.ellan.mahjong.rules'
version = '0.1.0-SNAPSHOT'

repositories {
    def ruleSdkRepo = providers.gradleProperty('mahjongRuleSdkRepo')
    if (ruleSdkRepo.isPresent()) {
        maven {
            url = uri(ruleSdkRepo.get())
        }
    }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation('io.github.ssttkkl:mahjong-utils-jvm') {
        version { strictly '0.7.7' }
    }

    compileOnly 'top.ellan.mahjong:mahjong-rule-spi:1.1.0'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'top.ellan.mahjong:mahjong-rule-spi:1.1.0'
    testImplementation 'top.ellan.mahjong:mahjong-rule-tck:1.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('jar') {
    archiveBaseName = 'riichi-rule-pack'
    archiveClassifier = 'thin'
    manifest {
        attributes(
            'Mahjong-Rule-Id': 'riichi',
            'Mahjong-Rule-Version': project.version,
            'Mahjong-SPI-Version': '1.1.0',
            'Mahjong-State-Schema': '1'
        )
    }
    into('META-INF') {
        from 'LICENSE'
        from 'NOTICE'
        from 'THIRD_PARTY_LICENSES.md'
    }
}

tasks.named('shadowJar') {
    archiveBaseName = 'riichi-rule-pack'
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}

def expectedMahjongUtilsSha256 = '0af586bf2d62fe60f91675e579a0e9e74d5deced1d23ecc63ebe3a1fb8219fa2'

tasks.register('verifyMahjongUtils') {
    group = 'verification'
    description = 'Verifies the pinned mahjong-utils-jvm 0.7.7 binary.'
    doLast {
        def artifact = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'io.github.ssttkkl' &&
                it.name == 'mahjong-utils-jvm' &&
                it.moduleVersion.id.version == '0.7.7'
        }
        if (artifact == null) {
            throw new GradleException('Pinned mahjong-utils-jvm:0.7.7 was not resolved')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.file.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != expectedMahjongUtilsSha256) {
            throw new GradleException("mahjong-utils-jvm hash mismatch: expected ${expectedMahjongUtilsSha256}, got ${actual}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyMahjongUtils')
}

tasks.register('verifyRulePackJar') {
    group = 'verification'
    description = 'Checks the ServiceLoader entry and parent-loaded SPI boundary.'
    dependsOn tasks.named('shadowJar')
    doLast {
        def archive = tasks.named('shadowJar').get().archiveFile.get().asFile
        def names = []
        zipTree(archive).visit { details ->
            if (!details.directory) {
                names.add(details.relativePath.pathString)
            }
        }
        if (names.any { name -> name.startsWith('top/ellan/mahjong/spi/') }) {
            throw new GradleException('Rule pack jar must not bundle mahjong-rule-spi classes')
        }
        if (!names.contains('META-INF/services/top.ellan.mahjong.spi.RulePackProvider')) {
            throw new GradleException('Rule pack jar has no RulePackProvider service descriptor')
        }
        if (!names.contains('META-INF/mahjong-rule-pack.properties')
            || !names.contains('assets/riichi/tile-visuals.properties')) {
            throw new GradleException('Rule pack jar is missing its static descriptor resources')
        }
        if (!names.any { name -> name.startsWith('mahjongutils/') }) {
            throw new GradleException('Riichi fat jar is missing its pinned mahjong-utils backend')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyRulePackJar')
}

tasks.register('microbenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH-free scoring and state-machine smoke benchmark (uses the normal runtime classpath).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.ellan.mahjong.rules.riichi.benchmark.RiichiMicrobenchmark'
    dependsOn tasks.named('testClasses')
}
