plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'top.ellan.mahjong.rules'
version = '2.0.2'
ext.ruleResourceId = 'riichi'
apply from: 'gradle/rule-resources.gradle'

repositories {
    def ruleSdkRepo = providers.gradleProperty('mahjongRuleSdkRepo')
    if (ruleSdkRepo.isPresent()) {
        maven {
            url = uri(ruleSdkRepo.get())
        }
    }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    compileOnly 'top.ellan.mahjong:mahjong-rule-spi:1.6.0'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'top.ellan.mahjong:mahjong-rule-spi:1.6.0'
    testImplementation 'top.ellan.mahjong:mahjong-rule-tck:1.6.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '256m'
    maxParallelForks = 1
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('jar') {
    archiveBaseName = 'riichi-rule-pack'
    archiveClassifier = 'thin'
    exclude 'assets/**', 'resourcepack/**', 'craftengine/**'
    manifest {
        attributes(
            'Mahjong-Rule-Id': 'riichi',
            'Mahjong-Rule-Version': project.version,
            'Mahjong-SPI-Version': '1.6.0',
            'Mahjong-State-Schema': '1'
        )
    }
    into('META-INF') {
        from 'LICENSE'
        from 'NOTICE'
        from 'THIRD_PARTY_LICENSES.md'
    }
}

tasks.named('shadowJar') {
    archiveBaseName = 'riichi-rule-pack'
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}

tasks.register('verifyRulePackJar') {
    group = 'verification'
    description = 'Checks the ServiceLoader entry and parent-loaded SPI boundary.'
    dependsOn tasks.named('shadowJar')
    doLast {
        def archive = tasks.named('shadowJar').get().archiveFile.get().asFile
        def names = []
        zipTree(archive).visit { details ->
            if (!details.directory) {
                names.add(details.relativePath.pathString)
            }
        }
        if (names.any { name -> name.startsWith('top/ellan/mahjong/spi/') }) {
            throw new GradleException('Rule pack jar must not bundle mahjong-rule-spi classes')
        }
        if (!names.contains('META-INF/services/top.ellan.mahjong.spi.RulePackProvider')) {
            throw new GradleException('Rule pack jar has no RulePackProvider service descriptor')
        }
        if (!names.contains('META-INF/mahjong-rule-pack.properties')) {
            throw new GradleException('Rule pack jar is missing its static descriptor')
        }
        if (names.any { name -> name.startsWith('assets/')
                || name.startsWith('resourcepack/')
                || name.startsWith('craftengine/')
                || name.endsWith('.ogg')
                || name.endsWith('.png')
                || name.endsWith('.mcmeta') }) {
            throw new GradleException('Rule pack jar must not contain presentation resources')
        }
        if (names.any { name -> name.startsWith('mahjongutils/')
                || name.startsWith('kotlin/')
                || name.startsWith('kotlinx/') }) {
            throw new GradleException('Riichi rule pack must be a pure-Java artifact')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyRulePackJar')
}

tasks.register('verifyNoRuntimeDependencies') {
    group = 'verification'
    description = 'Fails if production code gains a third-party runtime artifact.'
    doLast {
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        if (!artifacts.empty) {
            def coordinates = artifacts.collect { artifact ->
                artifact.moduleVersion.id.toString()
            }.sort()
            throw new GradleException("Riichi production runtime must stay dependency-free: ${coordinates}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyNoRuntimeDependencies')
}

tasks.register('microbenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH-free scoring and state-machine smoke benchmark (uses the normal runtime classpath).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'top.ellan.mahjong.rules.riichi.benchmark.RiichiMicrobenchmark'
    dependsOn tasks.named('testClasses')
}
