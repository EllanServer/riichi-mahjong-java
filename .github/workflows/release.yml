name: Release rule pack

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RULE_ID: riichi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Checkout pinned MahjongPaper Rule SDK source
        uses: actions/checkout@v7
        with:
          repository: EllanServer/MahjongEngine
          ref: aef1bbae6aececf8a8e8e89645a6ce1de72a2027
          path: .rule-sdk-source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Build pinned SPI and TCK repository
        working-directory: .rule-sdk-source
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :mahjong-rule-spi:publishAllPublicationsToTestRepository \
            :mahjong-rule-tck:publishAllPublicationsToTestRepository \
            --no-daemon
      - name: Validate immutable release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle | head -n 1)"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION" != *SNAPSHOT* ]]
          test "$TAG" = "v$VERSION"
          grep -qx "id=$RULE_ID" src/main/resources/META-INF/mahjong-rule-pack.properties
          grep -qx "version=$VERSION" src/main/resources/META-INF/mahjong-rule-pack.properties
          grep -qx "format=1" src/main/rule-resources/META-INF/mahjong-rule-resources.properties
          grep -qx "id=$RULE_ID" src/main/rule-resources/META-INF/mahjong-rule-resources.properties
          grep -qx "version=$VERSION" src/main/rule-resources/META-INF/mahjong-rule-resources.properties
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Compile, test and verify isolated thin JAR
        run: >-
          ./gradlew clean check
          -PmahjongRuleSdkRepo="$GITHUB_WORKSPACE/.rule-sdk-source/build/rule-sdk-repository"
          --no-daemon --stacktrace
      - name: Create registry candidate entry
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t JARS < <(find build/libs -maxdepth 1 -name "$RULE_ID-rule-pack-$VERSION.jar" -type f)
          test "${#JARS[@]}" -eq 1
          JAR="${JARS[0]}"
          RESOURCE="build/distributions/$RULE_ID-resource-pack-$VERSION.zip"
          test -f "$RESOURCE"
          SHA256="$(sha256sum "$JAR" | cut -d' ' -f1)"
          SIZE="$(stat -c '%s' "$JAR")"
          RESOURCE_SHA256="$(sha256sum "$RESOURCE" | cut -d' ' -f1)"
          RESOURCE_SIZE="$(stat -c '%s' "$RESOURCE")"
          SPI_VERSION="$(sed -n 's/^spiVersion=//p' src/main/resources/META-INF/mahjong-rule-pack.properties)"
          CORE_VERSION="$(sed -n 's/^requiredCoreVersion=//p' src/main/resources/META-INF/mahjong-rule-pack.properties)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$JAR")"
          RESOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$RESOURCE")"
          export SHA256 SIZE SPI_VERSION CORE_VERSION URL RESOURCE_SHA256 RESOURCE_SIZE RESOURCE_URL
          python3 - <<'PY'
          import json, os
          entry = {
              "id": os.environ["RULE_ID"],
              "version": os.environ["VERSION"],
              "url": os.environ["URL"],
              "sha256": os.environ["SHA256"],
              "spiVersion": os.environ["SPI_VERSION"],
              "requiredCoreVersion": os.environ["CORE_VERSION"],
              "sizeBytes": int(os.environ["SIZE"]),
              "resourceUrl": os.environ["RESOURCE_URL"],
              "resourceSha256": os.environ["RESOURCE_SHA256"],
              "resourceSizeBytes": int(os.environ["RESOURCE_SIZE"]),
          }
          with open("registry-entry.json", "w", encoding="utf-8", newline="\n") as output:
              json.dump(entry, output, ensure_ascii=True, separators=(",", ":"))
              output.write("\n")
          PY
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "resources=$RESOURCE" >> "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.jar }}
            ${{ steps.artifact.outputs.resources }}
            registry-entry.json
